<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed — The Maestro</title>
<meta name="description" content="Ahmed's official profile — Discord, Spotify, Instagram, Bybit.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:      #0a0a0b;
    --bg-2:    #121212;
    --ink:     #f1ede4;
    --muted:   #8a877e;
    --line:    #2a2825;
    --accent:  #c2a06a;
    --accent-dim: rgba(194,160,106,0.14);
    --online:  #5cba7d;
    --idle:    #dcab45;
    --dnd:     #d1564e;
    --offline: #5b5852;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background:
      radial-gradient(900px 500px at 15% -5%, rgba(194,160,106,0.06), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }

  .wrap{
    max-width:600px;
    margin:0 auto;
    padding:0 26px 60px;
  }

  /* ===== MASTHEAD ===== */
  .masthead{
    padding:76px 0 44px;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:24px;
    padding:6px 14px 6px 10px;
    border:1px solid var(--line);
    border-radius:999px;
  }

  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--offline);
    flex-shrink:0;
  }
  .dot.online{ background:var(--online); box-shadow:0 0 8px rgba(92,186,125,0.6); }
  .dot.idle{ background:var(--idle); }
  .dot.dnd{ background:var(--dnd); }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(50px, 12vw, 78px);
    line-height:0.96;
    letter-spacing:-1.5px;
  }

  h1 em{
    font-style:italic;
    font-weight:400;
    color:var(--accent);
  }

  .role{
    margin-top:16px;
    font-size:15px;
    color:var(--muted);
    font-weight:300;
    max-width:40ch;
    line-height:1.7;
  }

  /* ===== FLOATING BUTTONS ===== */
  .stack{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .float-btn{
    display:flex;
    align-items:center;
    gap:16px;
    padding:18px 22px;
    background:linear-gradient(180deg, #161513, #0f0e0d);
    border:1px solid var(--line);
    border-radius:20px;
    text-decoration:none;
    color:var(--ink);
    cursor:pointer;
    width:100%;
    text-align:left;
    font-family:inherit;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.03) inset,
      0 14px 30px -18px rgba(0,0,0,0.7);
    transition:transform 0.28s cubic-bezier(.2,.8,.2,1), border-color 0.28s ease, box-shadow 0.28s ease;
  }

  .float-btn:hover, .float-btn:focus-visible{
    transform:translateY(-4px);
    border-color:rgba(194,160,106,0.45);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 24px 40px -18px rgba(0,0,0,0.8),
      0 0 0 1px rgba(194,160,106,0.08);
  }
  .float-btn:active{ transform:translateY(-1px); }
  .float-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .float-btn .icon-box{
    width:42px; height:42px;
    flex-shrink:0;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-dim);
  }
  .float-btn .icon-box svg{ width:19px; height:19px; color:var(--accent); }

  .float-btn .text{ flex:1; min-width:0; }

  .float-btn .name{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:19px;
  }

  .float-btn .sub{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    margin-top:3px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:6px;
  }

  .live-dot{
    width:5px; height:5px; border-radius:50%;
    background:var(--online);
    flex-shrink:0;
    display:none;
  }
  .live-dot.show{ display:inline-block; }

  .float-btn .go{
    width:15px; height:15px;
    flex-shrink:0;
    color:var(--muted);
    transform:rotate(45deg);
    transition:transform 0.28s ease, color 0.28s ease;
  }
  .float-btn:hover .go{ color:var(--accent); transform:rotate(45deg) translate(2px,-2px); }

  .copy-note{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--online);
    text-align:center;
    height:16px;
    margin-top:16px;
    opacity:0;
    transition:opacity 0.2s ease;
  }
  .copy-note.show{ opacity:1; }

  footer{
    text-align:center;
    margin-top:50px;
  }
  footer p{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:1.5px;
    color:var(--muted);
    text-transform:uppercase;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="masthead">
    <div class="eyebrow">
      <span class="dot offline" id="statusDot"></span>
      <span id="statusText">tuning in…</span>
    </div>
    <h1>Ahmed<br><em>The Maestro</em></h1>
    <p class="role">A few places worth finding me — music, conversation, and everything in between.</p>
  </div>

  <div class="stack">

    <button class="float-btn" id="discordBtn" type="button">
      <div class="icon-box">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3c-.211.375-.444.877-.608 1.276a18.27 18.27 0 0 0-5.9 0A12.6 12.6 0 0 0 9.442 3a19.74 19.74 0 0 0-3.76 1.372C2.87 8.19 2.13 11.91 2.5 15.58a19.9 19.9 0 0 0 5.993 3.03c.484-.66.914-1.363 1.284-2.1a12.9 12.9 0 0 1-2.02-.97c.17-.124.336-.253.497-.386a14.16 14.16 0 0 0 12.06 0c.163.135.328.264.497.386-.64.38-1.32.703-2.024.972.372.735.802 1.438 1.286 2.098a19.85 19.85 0 0 0 5.996-3.03c.436-4.253-.65-7.933-2.752-11.211ZM9.68 13.34c-.914 0-1.664-.84-1.664-1.87s.735-1.87 1.664-1.87 1.68.846 1.664 1.87c0 1.03-.735 1.87-1.664 1.87Zm5.65 0c-.914 0-1.664-.84-1.664-1.87s.734-1.87 1.664-1.87c.93 0 1.68.846 1.664 1.87 0 1.03-.735 1.87-1.664 1.87Z"/></svg>
      </div>
      <div class="text">
        <div class="name">Discord</div>
        <div class="sub"><span class="live-dot" id="discordLiveDot"></span><span id="discordSub">k0.y — tap to add</span></div>
      </div>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17 17 7M7 7h10v10"/></svg>
    </button>

    <button class="float-btn" id="spotifyBtn" type="button">
      <div class="icon-box">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Zm4.586 14.424a.622.622 0 0 1-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.622.622 0 1 1-.277-1.215c3.809-.871 7.077-.496 9.712 1.115.293.18.386.564.207.857Zm1.223-2.723a.78.78 0 0 1-1.072.257c-2.688-1.652-6.786-2.13-9.965-1.165a.78.78 0 0 1-.453-1.492c3.63-1.102 8.14-.568 11.233 1.328.367.226.483.708.257 1.072Zm.105-2.836C14.692 8.95 9.375 8.775 6.297 9.71a.936.936 0 1 1-.543-1.79c3.532-1.073 9.404-.865 13.115 1.354a.936.936 0 0 1-.955 1.61Z"/></svg>
      </div>
      <div class="text">
        <div class="name">Spotify</div>
        <div class="sub"><span class="live-dot" id="spotifyLiveDot"></span><span id="spotifySub">open my profile</span></div>
      </div>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17 17 7M7 7h10v10"/></svg>
    </button>

    <button class="float-btn" id="instaBtn" type="button">
      <div class="icon-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
      </div>
      <div class="text">
        <div class="name">Instagram</div>
        <div class="sub">@i.ahmd.x</div>
      </div>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17 17 7M7 7h10v10"/></svg>
    </button>

    <button class="float-btn" id="copyBtn" type="button">
      <div class="icon-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div class="text">
        <div class="name">Bybit</div>
        <div class="sub">UID 569837416 — tap to copy</div>
      </div>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="7" width="12" height="12" rx="2"/></svg>
    </button>

  </div>

  <p class="copy-note" id="copyNote"></p>

  <footer>
    <p>Ahmed · The Maestro · 2026</p>
  </footer>

</div>

<script>
  // كل زرار يوديك على طول لمكانه — من غير ما يفتح تاب جديد أو يعرض لينك
  document.getElementById('discordBtn').addEventListener('click', () => {
    const webUrl = 'https://discord.com/users/530495809842839572';
    const appUrl = 'discord://discord.com/users/530495809842839572';
    let left = false;
    window.addEventListener('blur', () => { left = true; }, { once:true });
    window.location.href = appUrl;
    setTimeout(() => { if(!left) window.location.href = webUrl; }, 700);
  });

  document.getElementById('spotifyBtn').addEventListener('click', () => {
    const webUrl = 'https://open.spotify.com/user/312zfaqdqezdlli2m6awhduu7xee?si=xrKjklLzQzCIa1LLu5SGoQ';
    const appUrl = 'spotify:user:312zfaqdqezdlli2m6awhduu7xee';
    let left = false;
    window.addEventListener('blur', () => { left = true; }, { once:true });
    window.location.href = appUrl;
    setTimeout(() => { if(!left) window.location.href = webUrl; }, 700);
  });

  document.getElementById('instaBtn').addEventListener('click', () => {
    window.location.href = 'https://www.instagram.com/i.ahmd.x?igsh=aG9uc3Z6OGI2YjVs';
  });

  const copyBtn = document.getElementById('copyBtn');
  const copyNote = document.getElementById('copyNote');
  copyBtn.addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText('569837416');
      copyNote.textContent = 'UID copied to clipboard';
    }catch(e){
      copyNote.textContent = 'UID: 569837416';
    }
    copyNote.classList.add('show');
    setTimeout(()=>{ copyNote.classList.remove('show'); }, 2200);
  });

  const DISCORD_ID = '530495809842839572';
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const discordSub = document.getElementById('discordSub');
  const discordLiveDot = document.getElementById('discordLiveDot');
  const spotifySub = document.getElementById('spotifySub');
  const spotifyLiveDot = document.getElementById('spotifyLiveDot');

  const statusMap = {
    online:  { cls:'online',  label:'online now' },
    idle:    { cls:'idle',    label:'away' },
    dnd:     { cls:'dnd',     label:'do not disturb' },
    offline: { cls:'offline', label:'offline' }
  };

  async function fetchStatus(){
    try{
      const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
      const json = await res.json();
      if(!json.success) throw new Error('lanyard_fail');
      const data = json.data;
      const s = data.discord_status || 'offline';
      const info = statusMap[s] || statusMap.offline;

      // شارة الحالة العلوية
      statusDot.className = 'dot ' + info.cls;
      statusText.textContent = info.label;

      // زرار ديسكورد
      if(s === 'online' || s === 'idle' || s === 'dnd'){
        discordLiveDot.classList.add('show');
        discordSub.textContent = info.label;
      }else{
        discordLiveDot.classList.remove('show');
        discordSub.textContent = 'k0.y — tap to add';
      }

      // زرار سبوتيفاي: يعرض الأغنية الحالية لو شغالة فعلاً
      if(data.listening_to_spotify && data.spotify){
        spotifyLiveDot.classList.add('show');
        spotifySub.textContent = `${data.spotify.song} — ${data.spotify.artist}`;
      }else{
        spotifyLiveDot.classList.remove('show');
        spotifySub.textContent = 'open my profile';
      }
    }catch(e){
      statusDot.className = 'dot offline';
      statusText.textContent = 'status unavailable';
    }
  }

  fetchStatus();
  setInterval(fetchStatus, 20000);
</script>

</body>
</html>
